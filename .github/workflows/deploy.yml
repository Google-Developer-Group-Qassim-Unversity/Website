name: Deploy

# A push to dev deploys staging (dev.gdg-q.com); a push to main, which only
# ever receives dev, deploys production (gdg-q.com). Run it by hand on either
# branch to redeploy.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A deploy replaces its directory on the VPS; queue merges instead of overlapping them.
concurrency:
  group: deploy
  cancel-in-progress: false

# Everything that differs between the two deployments. Nothing below may name
# prod or staging directly. Staging talks to the staging backend
# (api-dev.gdg-q.com) and Clerk's development instance, like admin-dev.
env:
  BRANCH: ${{ github.ref_name }}
  INFISICAL_ENV: ${{ github.ref_name == 'dev' && 'staging' || 'prod' }}
  WEB_DIR: ${{ github.ref_name == 'dev' && 'GDG-frontend-staging' || 'GDG-frontend' }}
  WEB_CONTAINER: ${{ github.ref_name == 'dev' && 'gdg-score-web-staging' || 'gdg-score-web' }}
  WEB_PORT: ${{ github.ref_name == 'dev' && '3014' || '3010' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BRANCH,INFISICAL_ENV,WEB_DIR,WEB_CONTAINER,WEB_PORT
          script: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            DIR=~/$WEB_DIR

            TMP=$(mktemp -d)
            git clone --depth 1 --branch "$BRANCH" https://github.com/${{ github.repository }}.git "$TMP"
            rm -rf "$TMP/.git"
            chmod 755 "$TMP"  # mktemp makes it 700
            rm -rf "$DIR"
            mv "$TMP" "$DIR"
            cd "$DIR"

            source /etc/infisical/prod.env
            INFISICAL_TOKEN=$(infisical login --method="$INFISICAL_AUTH_METHOD" \
              --client-id="$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
              --client-secret="$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" --plain --silent)
            export INFISICAL_TOKEN
            infisical export --env=$INFISICAL_ENV --path=/main-frontend --projectId=300b1e97-7e52-4a4e-872d-053b9082cac5 \
              --format=dotenv --output-file=.env.production

            # The compose project is named after $DIR, so prod and staging never replace each other.
            CONTAINER_NAME=$WEB_CONTAINER HOST_PORT=$WEB_PORT \
              docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
            docker image prune -f

            # Smoke test: the container answers on its port.
            for i in $(seq 30); do
              if curl -fsS -o /dev/null localhost:$WEB_PORT/; then echo "Website is serving ✅"; exit 0; fi
              sleep 2
            done
            echo "Website failed its smoke test ❌"
            docker logs --tail 60 $WEB_CONTAINER
            exit 1
